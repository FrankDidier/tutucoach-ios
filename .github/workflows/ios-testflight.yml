name: iOS TestFlight

# Builds the iOS app with Xcode 26 (iOS 26 SDK, required by Apple since
# 2026-04-28) and uploads it to TestFlight via the App Store Connect API.
# Trigger manually from the Actions tab, or on pushes that touch the app.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'modules/**'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SCHEME: TutuCoachRN
      WORKSPACE: ios/TutuCoachRN.xcworkspace
      BUNDLE_ID: com.impit.tutucoach
      PROFILE_NAME: "TutuCoach AppStore"
      TEAM_ID: 6GAG9LR66G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Print toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Import signing certificate & profile
        env:
          CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.BUILD_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$CERT_P12_BASE64"   | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_BASE64"  | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$RUNNER_TEMP/export/$SCHEME.ipa"
          # altool 偶发对 Apple 服务器超时（-1001），单次失败不代表构建有问题。
          # 重试最多 3 次；全部失败才让这一步（以及整个 job）明确失败，避免
          # 「CI 绿灯但 TestFlight 里根本没有这个构建」的静默丢包。
          attempt=1
          max=3
          until [ "$attempt" -gt "$max" ]; do
            echo "== Upload attempt $attempt/$max =="
            if xcrun altool --upload-app \
                 -f "$IPA" -t ios \
                 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
              echo "Upload succeeded on attempt $attempt"
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 60s..."
            attempt=$((attempt+1))
            sleep 60
          done
          echo "::error::altool upload failed after $max attempts"
          exit 1

      # altool only uploads. Without assigning to beta groups + submitting
      # external Beta App Review, clients never see the build in TestFlight
      # (build stays READY_FOR_BETA_SUBMISSION).
      - name: Assign to TestFlight groups + submit Beta Review
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.impit.tutucoach
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request
          try:
              import jwt
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "PyJWT", "cryptography", "-q"])
              import jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          p8 = base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()) - 10, "exp": int(time.time()) + 18 * 60, "aud": "appstoreconnect-v1"},
              p8, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          if isinstance(token, bytes):
              token = token.decode()

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode() or "{}"
                      return r.status, json.loads(body) if body.strip() else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  try:
                      j = json.loads(body)
                  except Exception:
                      j = {"raw": body}
                  return e.code, j

          bundle = os.environ["BUNDLE_ID"]
          st, apps = api("GET", f"https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle}")
          assert st == 200 and apps.get("data"), apps
          app_id = apps["data"][0]["id"]

          build_id = None
          build_ver = None
          for _ in range(36):  # wait up to ~18 min for processing
              st, builds = api("GET", f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&sort=-uploadedDate&limit=5")
              assert st == 200, builds
              for b in builds["data"]:
                  a = b["attributes"]
                  if a.get("processingState") == "VALID" and not a.get("expired"):
                      build_id = b["id"]
                      build_ver = a.get("version")
                      break
              if build_id:
                  break
              print("waiting for VALID build…")
              time.sleep(30)
          assert build_id, "no VALID build found after upload"
          print(f"using build {build_ver} id={build_id}")

          st, groups = api("GET", f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups?limit=20")
          assert st == 200, groups
          for g in groups["data"]:
              name = g["attributes"].get("name")
              st, res = api("POST", f"https://api.appstoreconnect.apple.com/v1/betaGroups/{g['id']}/relationships/builds",
                            {"data": [{"type": "builds", "id": build_id}]})
              print(f"assign {name}: HTTP {st}")

          st, detail = api("GET", f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}?include=buildBetaDetail")
          ext = None
          for inc in detail.get("included") or []:
              if inc["type"] == "buildBetaDetails":
                  ext = inc["attributes"].get("externalBuildState")
          print(f"externalBuildState={ext}")
          if ext in (None, "READY_FOR_BETA_SUBMISSION", "READY_FOR_BETA_TESTING"):
              st, sub = api("POST", "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions", {
                  "data": {"type": "betaAppReviewSubmissions",
                           "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}
              })
              print(f"beta review submit: HTTP {st} {json.dumps(sub, ensure_ascii=False)[:400]}")
          else:
              print("skip beta review submit; already in progress/testing")
          PY

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TutuCoachRN-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
